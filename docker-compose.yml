services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-fastapi
    ports:
      - "8880:8880"
    volumes:
      - ./audio-output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - TARGET_MIN_TOKENS=175
      - TARGET_MAX_TOKENS=250
      - ABSOLUTE_MAX_TOKENS=450
    restart: unless-stopped

  # Fallback: full custom web UI if Kokoro-FastAPI's /web is too frustrating.
  # Start with: docker compose --profile fallback up -d
  kokoro-web:
    image: ghcr.io/eduardolat/kokoro-web:latest
    container_name: kokoro-web
    profiles: [fallback]
    ports:
      - "3000:3000"
    volumes:
      - kokoro-web-cache:/kokoro/cache
    environment:
      - KW_PUBLIC_NO_TRACK=true

volumes:
  kokoro-web-cache:
