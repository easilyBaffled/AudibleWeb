<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Local TTS Settings</title>
  <style>body { font-family: sans-serif; padding: 16px; } label { display: block; margin: 8px 0 4px; } input, select { width: 100%; padding: 4px; box-sizing: border-box; } button { margin-top: 12px; }</style>
</head>
<body>
  <h2>Local TTS Settings</h2>
  <label>Server Endpoint</label>
  <input id="endpoint" type="text" placeholder="http://localhost:8000/v1/audio/speech">
  <label>Voice</label>
  <input id="voice" type="text" placeholder="af_bella">
  <label>Model</label>
  <input id="model" type="text" placeholder="kokoro">
  <button id="save">Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
